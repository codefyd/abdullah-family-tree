<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<!--APP-START-->
<title>مشجرة عائلة عبدالله</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>document.documentElement.lang = "ar"; document.documentElement.dir = "rtl";</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap">
<style>
/* Layout: a full-bleed pannable map; a thin header on top, floating controls bottom-left, person sheet on the right (bottom on phones). */
:root {
  --bg: #eef2ef;
  --bg-grid: #dfe6e1;
  --surface: #ffffff;
  --surface-2: #f5f8f6;
  --ink: #18231f;
  --muted: #5b6a63;
  --line: #d3dcd7;
  --accent: #1f5f4e;
  --accent-ink: #ffffff;
  --accent-soft: #dcebe4;
  --danger: #b4372f;
  --danger-soft: #f7e3e1;
  --dec: #6f6a64;
  --dec-soft: #e6e3df;
  --shadow: 0 1px 2px rgb(20 40 32 / .08), 0 8px 24px rgb(20 40 32 / .10);
  --font-display: "Almarai", "Segoe UI", Tahoma, "Noto Sans Arabic", "Geeza Pro", sans-serif;
  --font-body: "Almarai", "Segoe UI", Tahoma, "Noto Sans Arabic", "Geeza Pro", "Arial", sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1513; --bg-grid: #18211e; --surface: #18201d; --surface-2: #1e2824;
    --ink: #e6ece9; --muted: #9aa8a1; --line: #2c3833; --accent: #6fcfae; --accent-ink: #0d1a15;
    --accent-soft: #1f3a31; --danger: #f08a80; --danger-soft: #3a1f1c; --dec: #b5aea6; --dec-soft: #34302c;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 10px 28px rgb(0 0 0 / .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1513; --bg-grid: #18211e; --surface: #18201d; --surface-2: #1e2824;
  --ink: #e6ece9; --muted: #9aa8a1; --line: #2c3833; --accent: #6fcfae; --accent-ink: #0d1a15;
  --accent-soft: #1f3a31; --danger: #f08a80; --danger-soft: #3a1f1c; --dec: #b5aea6; --dec-soft: #34302c;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 10px 28px rgb(0 0 0 / .45);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; overflow: hidden; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { position: fixed; inset: 0; display: flex; flex-direction: column; }

/* Header */
.bar {
  position: relative; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--surface) 88%, transparent); border-bottom: 1px solid var(--line);
  backdrop-filter: blur(8px);
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 21px; letter-spacing: 0; white-space: nowrap; }
.brand .count { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.search { position: relative; flex: 1 1 260px; max-width: 420px; min-width: 0; }
.search input {
  width: 100%; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2);
  padding: 0 36px 0 12px;
}
.search > svg { position: absolute; right: 11px; top: 11px; width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
.results {
  position: absolute; top: calc(100% + 6px); inset-inline: 0; background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--shadow); padding: 6px; margin: 0; list-style: none; max-height: min(60vh, 420px); overflow: auto; z-index: 30;
}
.results li { border-radius: 8px; padding: 8px 10px; cursor: pointer; display: grid; gap: 2px; }
.results li[aria-selected="true"], .results li:hover { background: var(--accent-soft); }
.results .r-name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.results .r-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.results .r-line { color: var(--muted); font-size: 12.5px; }
.results .empty { color: var(--muted); cursor: default; }
.results .empty:hover { background: none; }
.tools { display: flex; gap: 6px; margin-inline-start: auto; align-items: center; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 38px; min-width: 38px; padding: 0 12px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.icon { padding: 0; width: 38px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { background: var(--danger-soft); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.menu {
  position: absolute; top: calc(100% + 4px); left: max(16px, env(safe-area-inset-left, 0px)); width: 270px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; z-index: 40;
}
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px; border: 0; background: none; border-radius: 8px; cursor: pointer; text-align: start; }
.menu button:hover { background: var(--surface-2); }
.menu button svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
.menu .note { color: var(--muted); font-size: 12px; padding: 6px 10px 4px; line-height: 1.6; }

/* Stage */
.stage { position: relative; flex: 1; min-height: 0; overflow: hidden;
  background-color: var(--bg);
  background-image: radial-gradient(var(--bg-grid) 1.2px, transparent 1.3px);
  background-size: 22px 22px;
}
#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#map.dragging { cursor: grabbing; }

.controls { position: absolute; z-index: 10; display: flex; flex-direction: column; gap: 6px;
  left: calc(14px + env(safe-area-inset-left, 0px)); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
.controls .btn { box-shadow: var(--shadow); border-color: transparent; }
.minimap { position: absolute; z-index: 10; left: calc(14px + env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  width: 176px; height: 124px; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); overflow: hidden; touch-action: none; cursor: crosshair; }
.minimap svg { width: 100%; height: 100%; display: block; }
.minimap .vp { fill: color-mix(in srgb, var(--accent) 12%, transparent); stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; }

.status { position: absolute; z-index: 9; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); right: calc(14px + env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow);
  font-size: 12.5px; color: var(--muted); max-width: calc(100% - 230px); }
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.status.warn .dot { background: var(--danger); }
.status span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Person panel */
.panel { position: absolute; z-index: 15; top: 12px; bottom: 12px; right: calc(12px + env(safe-area-inset-right, 0px)); width: 360px; max-width: calc(100% - 24px);
  background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden;
  transform: translateX(0); transition: transform .28s ease, opacity .28s ease; }
.panel.closed { transform: translateX(calc(100% + 24px)); opacity: 0; pointer-events: none; }
.p-head { display: flex; gap: 14px; align-items: center; padding: 18px 18px 14px; border-bottom: 1px solid var(--line); position: relative; }
.p-avatar { width: 64px; height: 64px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 26px; font-weight: 700; overflow: hidden; border: 3px solid; }
.p-avatar img { width: 100%; height: 100%; object-fit: cover; }
.p-title { min-width: 0; flex: 1; }
.p-title h2 { margin: 0; font-family: var(--font-display); font-size: 22px; text-wrap: balance; }
.p-title .lineage { color: var(--muted); font-size: 13px; line-height: 1.6; margin-top: 2px; }
.p-close { position: absolute; top: 10px; left: 10px; }
.p-body { overflow: auto; padding: 14px 18px 18px; display: grid; gap: 14px; }
.p-body section { display: grid; gap: 10px; }
.p-body h3 { margin: 0; font-size: 11.5px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
.field { display: grid; gap: 5px; }
.field label { font-size: 12.5px; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); padding: 8px 10px; min-height: 38px; }
.field textarea { min-height: 76px; resize: vertical; line-height: 1.6; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row2 > * { min-width: 0; }
.photo-row { display: flex; gap: 8px; flex-wrap: wrap; }
.kids { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
.chip:hover { border-color: var(--accent); }
.muted { color: var(--muted); font-size: 12.5px; line-height: 1.6; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; border-top: 1px solid var(--line); padding-top: 14px; }
.spouse-box { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; display: grid; gap: 10px; }

/* Modal & toast */
.modal-back { position: fixed; inset: 0; z-index: 60; background: rgb(10 20 16 / .45); display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.modal { width: min(440px, 100%); background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; display: grid; gap: 14px; max-height: 86vh; overflow: auto; }
.modal h3 { margin: 0; font-size: 17px; }
.modal p { margin: 0; color: var(--muted); line-height: 1.7; }
.modal .m-actions { display: flex; gap: 8px; justify-content: flex-start; flex-wrap: wrap; }
.modal textarea { width: 100%; min-height: 180px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; direction: ltr; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); padding: 8px; }
.modal img { border-radius: 10px; border: 1px solid var(--line); }
.toast { position: fixed; z-index: 70; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow); font-size: 13.5px; max-width: calc(100% - 32px); }

@media (max-width: 720px) {
  .brand h1 { font-size: 18px; }
  .search { order: 3; flex-basis: 100%; max-width: none; }
  .btn .lbl { display: none; }
  .btn.has-lbl { padding: 0; width: 38px; }
  .panel { top: auto; bottom: 0; right: 0; left: 0; width: auto; max-width: none; max-height: 68%; border-radius: 18px 18px 0 0;
    padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .panel.closed { transform: translateY(calc(100% + 24px)); }
  .minimap { width: 120px; height: 86px; }
  .controls { bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
  .status { max-width: calc(100% - 170px); }
}
@media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
</style>
<style id="mapcss">
.edge { transition: opacity .25s ease; }
.has-sel .edge:not(.hl) { opacity: .2; }
.has-sel .node:not(.on-path):not(.sel) { opacity: .5; }
.node { cursor: pointer; transition: opacity .25s ease; outline: none; }
.node:focus-visible .halo { opacity: 1; stroke-dasharray: 4 3; }
.node .name { font-family: var(--font-body); font-weight: 700; font-size: 14px; fill: var(--ink); text-anchor: middle; direction: rtl;
  paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.node.root .name { font-family: var(--font-display); font-size: 22px; font-weight: 800; }
.node .ini { font-family: var(--font-body); font-weight: 700; text-anchor: middle; direction: rtl; pointer-events: none; }
.node.root .ini { font-family: var(--font-display); }
.badge rect { fill: var(--surface-2); stroke: var(--line); stroke-width: 1; }
.badge text { font-family: var(--font-body); font-size: 10.5px; font-weight: 700; fill: var(--muted); text-anchor: middle; direction: rtl; }
.badge.married rect { fill: var(--accent-soft); stroke: none; }
.badge.married text { fill: var(--accent); }
.badge.deceased rect { fill: var(--dec-soft); stroke: none; }
.badge.deceased text { fill: var(--dec); }
.badge.unknown rect { fill: none; stroke-dasharray: 3 2; }
.dec-ring { fill: none; stroke: var(--dec); stroke-width: 1.6; stroke-dasharray: 4 3; }
.counter { cursor: pointer; }
.counter circle { fill: var(--surface); stroke-width: 1.8; }
.counter text { font-family: var(--font-body); font-size: 11px; font-weight: 700; text-anchor: middle; }
.counter:hover circle { stroke-width: 2.6; }
.halo { fill: none; stroke: var(--accent); stroke-width: 3; opacity: 0; }
.node.sel .halo { opacity: 1; }
.node.on-path .av { stroke-width: 3.2; }
.node.pulse .halo { animation: pulse 1s ease-out 3; }
@keyframes pulse { 0% { opacity: 1; stroke-width: 3; } 100% { opacity: 0; stroke-width: 18; } }
@media (prefers-reduced-motion: reduce) { .node.pulse .halo { animation: none; opacity: 1; } }
</style>

<div class="app" id="app">
  <header class="bar">
    <div class="brand">
      <h1 id="familyTitle">عائلة عبدالله</h1>
      <span class="count" id="peopleCount"></span>
    </div>
    <div class="search" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="ابحث بالاسم… مثل: عبدالله" autocomplete="off" aria-label="بحث بالاسم" aria-controls="results" aria-expanded="false">
      <ul class="results" id="results" role="listbox" hidden></ul>
    </div>
    <div class="tools">
      <button class="btn has-lbl" id="layoutBtn" type="button" title="تبديل التخطيط"></button>
      <button class="btn icon" id="themeBtn" type="button"></button>
      <button class="btn icon" id="menuBtn" type="button" title="القائمة" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
    </div>
    <div class="menu" id="menu" hidden role="menu">
      <button type="button" data-cmd="export-json" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v3h16v-3"/></svg>تصدير ملف البيانات</button>
      <button type="button" data-cmd="import-json" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 0 4 4m-4-4-4 4M4 17v3h16v-3"/></svg>استيراد ملف بيانات</button>
      <button type="button" data-cmd="export-png" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>تصدير الخريطة كصورة</button>
      <hr>
      <button type="button" data-cmd="expand-all" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>فتح كل الفروع</button>
      <button type="button" data-cmd="reset" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg>إعادة الضبط إلى البيانات الأصلية</button>
      <p class="note">التعديلات تُحفظ في ذاكرة هذا المتصفح فقط. لنقلها لجهاز آخر أو مشاركتها، صدّر ملف البيانات ثم استورده هناك.</p>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </header>

  <main class="stage" id="stage">
    <svg id="map" role="img" aria-label="خريطة ذهنية لعائلة عبدالله">
      <g id="viewport">
        <g id="content">
          <defs>
            <clipPath id="clip20"><circle r="20"/></clipPath>
            <clipPath id="clip44"><circle r="44"/></clipPath>
          </defs>
          <g id="edges"></g>
          <g id="nodes"></g>
        </g>
      </g>
    </svg>

    <div class="controls" aria-label="أدوات التنقل">
      <button class="btn icon" type="button" id="zoomIn" title="تكبير"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="btn icon" type="button" id="zoomOut" title="تصغير"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <button class="btn icon" type="button" id="fitBtn" title="ملاءمة الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="btn icon" type="button" id="rootBtn" title="التمركز على الجد"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    </div>
    <div class="minimap" id="minimap" title="خريطة مصغرة: انقر أو اسحب للتنقل">
      <svg id="mini"><g id="miniContent"></g><rect class="vp" id="miniVp"/></svg>
    </div>
    <div class="status" id="status"><i class="dot"></i><span id="statusText">التعديلات محفوظة في هذا المتصفح فقط</span></div>

    <aside class="panel closed" id="panel" aria-label="بطاقة الشخص" aria-hidden="true">
      <div class="p-head">
        <div class="p-avatar" id="pAvatar"></div>
        <div class="p-title">
          <h2 id="pName"></h2>
          <div class="lineage" id="pLineage"></div>
        </div>
        <button class="btn icon p-close" type="button" id="pClose" title="إغلاق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="p-body">
        <section>
          <div class="field"><label for="fName">الاسم</label><input id="fName" type="text" maxlength="60"></div>
          <div class="row2">
            <div class="field"><label for="fGender">الجنس</label>
              <select id="fGender"><option value="male">ذكر</option><option value="female">أنثى</option></select></div>
            <div class="field"><label for="fLife">حالة الحياة</label>
              <select id="fLife"><option value="unknown">غير محددة</option><option value="alive">على قيد الحياة</option><option value="deceased">متوفى</option></select></div>
          </div>
          <div class="field"><label for="fMarital">حالة الزواج</label>
            <select id="fMarital"><option value="unknown">غير محددة</option><option value="married">متزوج</option><option value="unmarried">غير متزوج</option></select></div>
          <div class="spouse-box" id="spouseBox">
            <div class="field"><label for="fSpouse" id="lSpouse">اسم الزوجة</label><input id="fSpouse" type="text" maxlength="80" placeholder="غير محدد"></div>
            <div class="field"><label for="fSpouseFamily" id="lSpouseFamily">عائلة الزوجة</label><input id="fSpouseFamily" type="text" maxlength="80" placeholder="غير محددة"></div>
          </div>
        </section>
        <section>
          <h3>الصورة</h3>

function compressImage(file, size, quality) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(img.naturalWidth, img.naturalHeight);
      if (!s) { URL.revokeObjectURL(url); return reject(new Error("empty")); }
      const cv = document.createElement("canvas"); cv.width = cv.height = Math.min(size, s);
      const ctx = cv.getContext("2d");
      ctx.drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });
}

}

/* ---------- Search ---------- */
const norm = (s) => String(s).normalize("NFKC").replace(/[ً-ٰٟـ]/g, "").replace(/[أإآٱ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه").replace(/\s+/g, "").toLowerCase();
let resultIds = [], activeIdx = -1;
function runSearch() {
  const q = norm($("#q").value);
  const list = $("#results");
  if (!q) { list.hidden = true; $("#q").setAttribute("aria-expanded", "false"); resultIds = []; return; }
  const multi = /\s/.test($("#q").value.trim());
  const scored = [];
  for (const p of data.people) {
    const n = norm(p.name);
    let score = -1;
    if (n === q) score = 0; else if (n.startsWith(q)) score = 1; else if (n.includes(q)) score = 2;
    else if (multi && norm(lineage(p.id)).includes(q)) score = 3;
    if (score >= 0) scored.push({ id: p.id, score, depth: depthOf(p.id) });
  }
  scored.sort((a, b) => a.score - b.score || a.depth - b.depth);
  resultIds = scored.slice(0, 30).map((s) => s.id);
  activeIdx = resultIds.length ? 0 : -1;
  list.innerHTML = resultIds.length
    ? resultIds.map((id, i) => `<li role="option" data-id="${esc(id)}" aria-selected="${i === activeIdx}"><span class="r-name"><i class="r-dot" style="background:${colors(id).main}"></i>${esc(byId.get(id).name)}</span><span class="r-line">${esc(lineage(id))}</span></li>`).join("")
    : `<li class="empty">لا توجد نتائج لـ «${esc($("#q").value.trim())}»</li>`;
  const head = resultIds.length > 1 ? `<li class="empty" style="font-size:12px;padding:4px 10px">${nf.format(resultIds.length)} نتائج</li>` : "";
  list.insertAdjacentHTML("afterbegin", head);
  list.hidden = false; $("#q").setAttribute("aria-expanded", "true");
}
function pickResult(id) {
  $("#results").hidden = true; $("#q").setAttribute("aria-expanded", "false");
  $("#q").blur();
  select(id, { pulse: true });
}
$("#q").addEventListener("input", runSearch);
$("#q").addEventListener("focus", () => { if ($("#q").value.trim()) runSearch(); });
$("#q").addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); if (!resultIds.length) return;
    activeIdx = (activeIdx + (e.key === "ArrowDown" ? 1 : -1) + resultIds.length) % resultIds.length;
    $("#results").querySelectorAll("li[data-id]").forEach((li, i) => li.setAttribute("aria-selected", String(i === activeIdx)));
  } else if (e.key === "Enter" && activeIdx >= 0) { e.preventDefault(); pickResult(resultIds[activeIdx]); }
  else if (e.key === "Escape") { $("#results").hidden = true; }
});
$("#results").addEventListener("pointerdown", (e) => { const li = e.target.closest("li[data-id]"); if (li) { e.preventDefault(); pickResult(li.dataset.id); } });
document.addEventListener("pointerdown", (e) => {
  if (!e.target.closest(".search")) $("#results").hidden = true;
  if (!e.target.closest("#menu") && !e.target.closest("#menuBtn")) closeMenu();
});

/* ---------- Modal, toast ---------- */
function confirmBox(title, msg, okLabel, danger) {
  return new Promise((resolve) => {
    const root = $("#modalRoot");
    root.innerHTML = `<div class="modal-back"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mT"><h3 id="mT">${esc(title)}</h3><p>${esc(msg)}</p>
      <div class="m-actions"><button class="btn ${danger ? "primary" : "primary"}" type="button" data-r="1" ${danger ? 'style="background:var(--danger);border-color:var(--danger);color:#fff"' : ""}>${esc(okLabel)}</button><button class="btn" type="button" data-r="0">إلغاء</button></div></div></div>`;
    const done = (v) => { root.innerHTML = ""; document.removeEventListener("keydown", onKey, true); resolve(v); };
    const onKey = (e) => { if (e.key === "Escape") { e.stopPropagation(); done(false); } };
    document.addEventListener("keydown", onKey, true);
    root.querySelector(".modal-back").addEventListener("click", (e) => {
      if (e.target.classList.contains("modal-back")) return done(false);
      const b = e.target.closest("[data-r]"); if (b) done(b.dataset.r === "1");
    });
    root.querySelector('[data-r="0"]').focus();
  });
}
function infoBox(title, html) {
  const root = $("#modalRoot");
  root.innerHTML = `<div class="modal-back"><div class="modal" role="dialog" aria-modal="true"><h3>${esc(title)}</h3>${html}<div class="m-actions"><button class="btn" type="button" data-close>إغلاق</button></div></div></div>`;
  root.querySelector(".modal-back").addEventListener("click", (e) => { if (e.target.classList.contains("modal-back") || e.target.closest("[data-close]")) root.innerHTML = ""; });
  return root.querySelector(".modal");
}
let toastTimer;
function toast(msg) {
  let t = $(".toast");
  if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3200);
}

/* ---------- File save (claude.ai downloads capability, else a normal download) ---------- */
let dlPromise = null;
function getDownloads() {
  if (!window.claude || typeof window.claude.use !== "function") return Promise.resolve(null);
  dlPromise ||= Promise.race([window.claude.use("downloads").catch(() => null), new Promise((r) => setTimeout(() => r(null), 10500))]);
  return dlPromise;
}
async function saveFile(filename, blob, fallback) {
  const dl = await getDownloads();
  if (dl) {
    try { await dl.save({ filename, data: blob }); toast("تم حفظ الملف"); return; }
    catch (e) { if (e?.code === "declined") { toast("أُلغي الحفظ"); return; } if (e?.code === "rate_limited") { toast("انتظر قليلًا ثم حاول مرة أخرى"); return; } }
  }
  if (window.top !== window && fallback) { fallback(); return; } // embedded view without downloads: show content to copy/save manually
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast("تم تنزيل الملف");
}
getDownloads();
function exportJSON() {
  const text = JSON.stringify(data, null, 2);
  saveFile("family-data.json", new Blob([text], { type: "application/json" }), () => {
    const m = infoBox("ملف البيانات", `<p>انسخ النص التالي واحفظه في ملف باسم family-data.json.</p><textarea readonly id="jsonOut"></textarea><div class="m-actions"><button class="btn primary" type="button" id="copyJson">نسخ</button></div>`);
    const ta = m.querySelector("#jsonOut"); ta.value = text;
    m.querySelector("#copyJson").addEventListener("click", async () => { try { await navigator.clipboard.writeText(text); toast("نُسخ النص"); } catch { ta.select(); toast("حدد النص وانسخه يدويًا"); } });
  });
}
$("#importFile").addEventListener("change", async (e) => {
  const file = e.target.files?.[0]; e.target.value = "";
  if (!file) return;
  let next;
  try { next = validateData(JSON.parse(await file.text())); }
  catch (err) { await confirmBox("تعذر الاستيراد", err instanceof SyntaxError ? "الملف ليس بصيغة JSON صحيحة." : err.message, "حسنًا", false); return; }
  const ok = await confirmBox("استيراد ملف البيانات", `سيستبدل الملف (${nf.format(next.people.length)} فردًا) البيانات الحالية في هذا المتصفح (${nf.format(data.people.length)} فردًا).`, "استيراد", false);
  if (!ok) return;
  data = next; collapsed.clear(); reindex(); savePrefs(); saveData(true);
  closePanel(); for (const el of nodeEls.values()) el.remove(); for (const el of edgeEls.values()) el.remove();
  nodeEls.clear(); edgeEls.clear(); cur.clear();
  render({ animate: false }); fitView(false);
  toast(`تم استيراد ${nf.format(data.people.length)} فردًا`);
});

/* ---------- Export the map as a PNG ---------- */
async function exportPNG() {
  toast("جارٍ تجهيز الصورة…");
  if (tween) await new Promise((r) => setTimeout(r, 520));
  const ids = visibleIds();
  const b = boundsOf(ids, targets), pad = 48, titleH = 70;
  const W = Math.ceil(b.x1 - b.x0 + pad * 2), H = Math.ceil(b.y1 - b.y0 + pad * 2 + titleH);
  const cs = getComputedStyle(document.documentElement);
  const tokens = ["--bg", "--surface", "--surface-2", "--ink", "--muted", "--line", "--accent", "--accent-soft", "--dec", "--dec-soft", "--font-body", "--font-display"]
    .map((t) => `${t}:${cs.getPropertyValue(t).trim()}`).join(";");
  const clone = $("#content").cloneNode(true);
  clone.querySelectorAll(".node").forEach((n) => { n.classList.remove("sel", "on-path", "pulse"); n.style.opacity = ""; n.removeAttribute("tabindex"); });
  clone.querySelectorAll(".edge").forEach((n) => { n.classList.remove("hl"); n.style.opacity = ""; n.setAttribute("fill-opacity", depthOf(n.dataset.id) <= 1 ? ".92" : ".78"); });
  clone.querySelectorAll("title").forEach((t) => t.remove());
  const bg = cs.getPropertyValue("--bg").trim();
  const svg = `<svg xmlns="${SVGNS}" xmlns:xlink="http://www.w3.org/1999/xlink" width="${W}" height="${H}" viewBox="${b.x0 - pad} ${b.y0 - pad - titleH} ${W} ${H}">`
    + `<style>svg{${tokens}}${$("#mapcss").textContent}</style>`
    + `<rect x="${b.x0 - pad}" y="${b.y0 - pad - titleH}" width="${W}" height="${H}" fill="${bg}"/>`
    + `<text x="${(b.x0 + b.x1) / 2}" y="${b.y0 - pad - titleH + 52}" text-anchor="middle" style="font-family:var(--font-display);font-weight:700;font-size:30px;fill:var(--ink);direction:rtl">${esc(data.familyName || "عائلة عبدالله")}</text>`
    + clone.outerHTML.replace(/ id="content"/, "") + `</svg>`;
  try {
    const img = new Image();
    const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml;charset=utf-8" }));
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    const scale = Math.min(2, 8000 / Math.max(W, H));
    const cv = document.createElement("canvas"); cv.width = Math.round(W * scale); cv.height = Math.round(H * scale);
    const ctx = cv.getContext("2d"); ctx.scale(scale, scale); ctx.drawImage(img, 0, 0, W, H);
    URL.revokeObjectURL(url);
    const blob = await new Promise((r) => cv.toBlob(r, "image/png"));
    if (!blob) throw new Error("toBlob");
    saveFile("مشجرة-عائلة-عبدالله.png", blob, () => {
      const u = URL.createObjectURL(blob);
      infoBox("صورة الخريطة", `<p>اضغط مطولًا على الصورة (أو انقر بالزر الأيمن) واختر «حفظ الصورة».</p><img alt="خريطة عائلة عبدالله" src="${u}">`);
    });
  } catch { toast("تعذر إنشاء الصورة في هذا المتصفح"); }
}
